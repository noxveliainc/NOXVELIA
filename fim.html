<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noxvelia - Encerramento Animado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030811;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .outro-container {
            position: relative;
            width: 1080px;
            height: 1920px; /* Formato Vertical 9:16 para TikTok e Reels */
            background: linear-gradient(135deg, #071326 0%, #030811 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px;
            overflow: hidden;
        }

        /* Efeito de brilho de fundo subtil */
        .glow-effect {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(217,196,156,0.12) 0%, rgba(7,19,38,0) 70%);
            border-radius: 50%;
            animation: pulseGlow 4s ease-in-out infinite;
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
        }

        /* Contentor do Logótipo Real com animação */
        .logo-box {
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(217, 196, 156, 0.2);
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 40px rgba(217,196,156,0.15);
            margin-bottom: 40px;
            transform: scale(0.8);
            animation: scaleIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.5s;
            backdrop-filter: blur(10px);
        }

        .logo-svg {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        /* Nome da Marca */
        .brand-name {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* Slogan */
        .brand-tagline {
            font-size: 24px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 48px;
            letter-spacing: 0.5px;
        }

        /* URL Dourado em Destaque */
        .url-pill {
            background: rgba(217, 196, 156, 0.1);
            border: 2px solid #d9c49c;
            padding: 20px 48px;
            border-radius: 99px;
            color: #d9c49c;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(217, 196, 156, 0.15);
            animation: bounceSubtle 3s ease-in-out infinite 1.5s;
        }

        /* ANIMAÇÕES */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            to {
                transform: scale(1);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes bounceSubtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="outro-container">
        <div class="glow-effect"></div>
        
        <div class="content-wrapper">
            <!-- Logótipo Oficial Estilizado da Noxvelia -->
            <div class="logo-box">
                <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Arco Exterior Azul -->
                    <path d="M40 110C40 71.3401 71.3401 40 110 40C135.211 40 157.062 53.3039 169 73" stroke="url(#blueGradient)" stroke-width="22" stroke-linecap="round"/>
                    <!-- Vrtice / Onda Dourada Dinâmica -->
                    <path d="M30 135C55 165 115 170 145 130C165 102 155 70 135 60" stroke="url(#goldGradient)" stroke-width="18" stroke-linecap="round"/>
                    <path d="M110 95C125 95 140 110 130 125C120 138 95 135 85 115C75 95 90 75 115 75" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="blueGradient" x1="40" y1="40" x2="169" y2="110" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3b82f6"/>
                            <stop offset="1" stop-color="#1e3a8a"/>
                        </linearGradient>
                        <linearGradient id="goldGradient" x1="30" y1="60" x2="155" y2="165" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fef08a"/>
                            <stop offset="0.5" stop-color="#d9c49c"/>
                            <stop offset="1" stop-color="#854d0e"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <h1 class="brand-name">Noxvelia</h1>
            <p class="brand-tagline">O novo padrão do mercado em Portugal</p>
            
            <div class="url-pill">
                noxvelia.com
            </div>
        </div>
    </div>

</body>
</html>
